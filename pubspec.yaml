name: mobile_prakerin
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  another_flutter_splash_screen: ^1.2.1
  intl: ^0.20.2
  calendar_date_picker2: ^2.0.1
  image_picker: ^1.1.2
  file_picker: ^10.2.0
  google_maps_flutter: ^2.12.3
  geolocator: ^11.0.0
  dio: ^5.8.0+1
  fluttertoast: ^8.2.12
  shared_preferences: ^2.5.3
  lottie: ^3.3.1
  device_info_plus: ^12.1.0
  url_launcher: ^6.3.2
  syncfusion_flutter_pdfviewer: ^31.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
  assets:
    - assets/images/
    - assets/pdf/
